##--------fonts Configurtion--------##



font_family      
# family="JetBrains Mono"
font_size   11
adjust_line_height 5
italic_font auto 

italic_font auto      
# family='JetBrains Mono' style=Light variable_name=JetBrainsMonoItalic
bold_italic_font auto

##--------Windows configurtion--------##
background_opacity 0.50
Window_padding_width 10
hide_window_decorations yes
remember_window_size no
background_blur 70
initial_window_height 78c
initial_window_width 50c

confirm_os_window_close 0
 
padding_width 20
padding_height 20

window_margin_width 20
window_margin_height 20

drow_minimal_border yes
window_border_width 2px
strip_trailing_spaces smart


url_color #ffffff
url_style curly

##--------Colors configurtion--------##
foreground #c6c7af
# background  #424242

color0 #272627
color1 #fd0808
color2 #ee0d0d
color3 #ff00c3
color4 #20cd57
color5 #4907a0
color6 #176d82
color7 #8a16c3
color8 #20a417
selection_background  #424242
selection_foreground #21af24


##---------Curser configuretion---------##
cursor_color #45167ce6
cursor_shape beam
cursor_blink_interval 0.5

##------------Tabs configuretion----------##
tab_bar_style powerline
tab_separator " | "


##------------scrolling  configuretion----------##
scrollback_lines 10000
wheel_scroll_multiplier 5



##------------copy/paste  configuretion----------##

copy_on_select yes
clipboard_control write-clipboard write-primary


##------------mouse  configuretion----------##
mouse_hide_wait 3


##------------general  configuretion----------##
sync_to_monitor no
repaint_delay 10
enable_audio_bell never

##------------shell  configuretion----------##

shell zsh
shell_integration no_cursor


##------------keybinding  configuretion----------##
map ctrl+shift+t new_tab
map ctrl+shift+n new_window
map ctrl+shift+w close_window
map ctrl+c copy_to_clipboard
map ctrl+v paste_from_clipboard
map ctrl+shift+y move_tab 
map ctrl+plus change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0

map ctrl+shift+c combine : copy_to_clipboard : launch --type=background sh -c "notify-send 'Kitty' 'Copied to clipboard'"

map alt+tab next_tab 
map alt+1 goto_tab 1 
map alt+2 goto_tab 2 
map alt+3 goto_tab 3
map ctrl+shift+left move_tab_backward
map ctrl+shift+right move_tab_forward



